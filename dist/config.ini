; qrfs - 扫码快传 配置文件
; 修改保存后，回到主界面点【重启服务】生效。
;
; Port     端口号；不写该行或留空 → 自动选一个空闲端口
; Password 密码：
;            不写该行   → 每次启动自动生成随机密码
;            Password=  → 空密码（任何人都能连）
;            Password=abc → 使用密码 abc
; WWWRoot  网站根目录：不写该行、留空或目录不存在 → 使用上次保存的目录（默认桌面）
;            例如：WWWRoot=D:\SharedFiles

[Server]
Port=
Password=
WWWRoot=

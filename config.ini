; qrfs - 扫码快传 配置文件
; 修改保存后，回到主界面点【重启服务】生效。

[Server]

; 网站根目录
;   不写该行、留空或目录不存在 → 使用上次保存的目录（默认桌面）
;   如：WWWRoot=D:\SharedFiles
WWWRoot=

; 端口号不写行或留空 → 使用默认端口 18900（被占用时自动切换随机端口）
Port=

; 密码[重要]：
;   不写该行      → 每次启动自动生成随机密码
;   Password=     → 空密码（任何人都能连）
;   Password=abc  → 使用密码 abc
Password=

; 剪贴板提醒阈值（字节数，也等于字符数）：
;   不写该行或留空 → 使用默认 16384（约 16 KB）
;    此值不限制传输长度，只用于"超过此值时手机端弹 toast 提醒"
;   16384 / 32768 / 49152 / 65536 / 131072
ClipboardMax=
